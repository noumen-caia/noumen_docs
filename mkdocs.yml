site_name: Noumen
site_description: Документация по системе CodeFlowAI для создания рабочих процессов
site_author: CodeFlowAI Team
site_url: https://noumen-caia.github.io/noumen_docs/

# Простая и чистая тема
theme:
  name: shadcn
  language: ru
  icon: logo.svg
  favicon: favicon.svg
  custom_dir: overrides

# Навигация
nav:
  - Главная: index.md
  - Руководство пользователя: user_guide.md
  - Руководство разработчика: developer_guide.md
  - Разработка расширений:
      - Что такое расширение?: extension/index.md
      - Начало работы: extension/get-started/your-first-extension.md
      - Анатомия: extension/get-started/extension-anatomy.md
      - Пример Команды: extension/guides/command.md
  - Справочник нод:
      - Список: nodes/index.md

# Простые расширения Markdown
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - codehilite
  - fenced_code

# Простые стили для двухколоночной структуры
extra_css:
  - stylesheets/extra.css

# Убираем JavaScript для простоты
# extra_javascript:
#   - javascripts/mathjax.js

# Настройки для разработки
dev_addr: 127.0.0.1:8000
