site_name: Noumen
site_description: Документация по системе CodeFlowAI для создания рабочих процессов
site_author: CodeFlowAI Team
site_url: https://noumen-caia.github.io/noumen_docs/

# Простая и чистая тема
theme:
  name: shadcn
  language: ru
  icon: logo.svg
  favicon: favicon.svg
  custom_dir: overrides

# Навигация
nav:
  - Главная: index.md
  - Руководство пользователя: user_guide.md
  - Руководство разработчика: developer_guide.md
  - Extension API:
      - Что такое расширение?: extension/index.md
      - Ваше первое расширение: extension/get-started/your-first-extension.md
      - Анатомия расширения: extension/get-started/extension-anatomy.md
      - Возможности SDK: extension/capabilities.md
      - Команда: extension/guides/command.md
      - Конфигурация: extension/guides/configuration.md
      - Файловая система: extension/guides/fs.md
      - Привязки клавиш: extension/guides/keybinding.md
      - Редактор нод: extension/guides/node-editor.md
      - Ноды: extension/guides/nodes.md
      - Нотация: extension/guides/notation.md
      - Уведомления: extension/guides/notifications.md
      - QuickInput: extension/guides/quick-input.md
      - Statusbar: extension/guides/statusbar.md
      - Тема: extension/guides/theme.md
      - Contribution Points: extension/references/contribution-points.md
      - Манифест расширения: extension/references/extension-manifest.md
      - SDK API: extension/references/sdk.md
      - Тестирование и публикация: extension/testing-and-publish.md
  - Справочник нод:
      - Список: nodes/index.md

# Простые расширения Markdown
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - codehilite
  - fenced_code

# Простые стили для двухколоночной структуры
extra_css:
  - stylesheets/extra.css

# Убираем JavaScript для простоты
# extra_javascript:
#   - javascripts/mathjax.js

# Настройки для разработки
dev_addr: 127.0.0.1:8000
